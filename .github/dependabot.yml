version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/packages/live"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@live"
  - package-ecosystem: "npm"
    directory: "/packages/static"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@static"
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@scripts"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "tsx"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@tests"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "tsx"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
